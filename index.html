<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>Paperlane — Markdown studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="print.css" media="print" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><div class="brand"><span class="brand-mark">P</span><span>paperlane</span></div><button class="close-library" id="closeLibrary" type="button">← Back to note</button></div>
        <button class="new-file" id="newFile"><span>＋</span> New file <kbd>⌘ N</kbd></button>
        <button class="open-file" id="openFile"><span>↗</span> Open markdown</button>
        <input id="fileInput" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden />
        <div class="side-section"><p class="side-label">YOUR LIBRARY</p><div class="document-list" id="documentList"></div></div>
        <div class="sidebar-footer"><span class="sync-dot"></span> Saved locally<br /><span class="credit-line">Created by Ramesh</span></div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open files" aria-expanded="false" title="Open files"><span aria-hidden="true">☰</span><span class="files-label">Files</span></button>
          <div class="doc-identity"><div class="doc-icon">⌁</div><div><h1 id="documentName">Untitled note</h1><p id="saveStatus">All changes saved</p></div></div>
          <div class="top-actions">
            <button class="mobile-view-toggle" id="mobileViewToggle" aria-label="Show preview" aria-pressed="false" title="Show preview"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></svg><span class="sr-only">Show preview</span></button>
            <button class="icon-button" id="focusMode" aria-label="Toggle focus mode" title="Focus mode">⛶</button>
            <div class="export-wrap"><button class="export-button" id="exportMenu" aria-haspopup="menu" aria-expanded="false">Export <span aria-hidden="true">⌄</span></button><div class="export-popover" id="exportPopover"><button data-export="md">Markdown <small>.md</small></button><button data-export="pdf">PDF <small>Print-ready</small></button><button data-export="epub">EPUB <small>eBook</small></button></div></div>
          </div>
        </header>

        <div class="formatbar">
          <select id="blockStyle" aria-label="Block style"><option value="p">Paragraph</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="quote">Quote</option></select>
          <span class="divider"></span>
          <button data-command="bold" title="Bold"><b>B</b></button><button data-command="italic" title="Italic"><i>I</i></button><button data-command="code" title="Inline code">&lt;/&gt;</button>
          <span class="divider"></span>
          <button data-command="ul" title="Bullet list">☷</button><button data-command="ol" title="Numbered list">☷<sup>1</sup></button><button data-command="task" title="Task list">☑</button>
          <span class="divider"></span>
          <button data-command="link" title="Link">⌁</button><button data-command="table" title="Table">▦</button><button data-command="image" title="Image">▧</button>
          <span class="divider"></span>
          <div class="font-picker"><span>Font</span><select id="fontChoice" aria-label="Editor font"><option value="literata">Literata</option><option value="calibri">Calibri</option><option value="helvetica">Helvetica</option><option value="mono">Mono</option></select></div>
        </div>

        <div class="document-area">
          <section class="editor-pane"><div class="pane-meta"><span>MARKDOWN</span><span id="wordCount">0 words</span></div><textarea id="editor" spellcheck="true" aria-label="Markdown editor"></textarea></section>
          <div class="resize-handle" aria-hidden="true"></div>
          <article class="preview-pane"><div class="pane-meta"><span>PREVIEW</span><span class="preview-controls"><select id="previewFontChoice" aria-label="Preview font"><option value="literata">Literata</option><option value="calibri">Calibri</option><option value="helvetica">Helvetica</option><option value="mono">Mono</option></select><span class="live-pill"><i></i> LIVE</span></span></div><div id="preview" class="prose"></div></article>
        </div>
      </section>
    </main>
    <button class="sidebar-scrim" id="sidebarScrim" aria-label="Close files"></button>
    <div class="toast" id="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
